base_model: meta-llama/Llama-3.2-3B-Instruct
trust_remote_code: true
strict: false

chat_template: chatml

load_in_8bit: false
load_in_4bit: false

plugins:
  - axolotl.integrations.liger.LigerPlugin

liger_rope: true
liger_rms_norm: true
liger_glu_activation: true
liger_layer_norm: true
liger_fused_linear_cross_entropy: true

datasets:
  - path: ./outputs/dataset_tokenlab/train
    type: chat_template
    weight: 0.8
  - path: ./outputs/dataset_cemig/train
    type: chat_template
    weight: 0.2

validation_datasets:
  - path: ./outputs/dataset_tokenlab/validation
    type: chat_template
    weight: 0.8
  - path: ./outputs/dataset_cemig/validation
    type: chat_template
    weight: 0.2

test_datasets:
  - path: ./outputs/dataset_tokenlab/test
    type: chat_template
    weight: 0.8
  - path: ./outputs/dataset_cemig/test
    type: chat_template
    weight: 0.2

val_set_size: 0.0

dataset_prepared_path: ./outputs/dataset_prepared
output_dir: ./outputs/cemig-sft-2gpu-chatml/

sequence_len: 4096
sample_packing: true
pad_to_sequence_len: true
flash_attn: true

gradient_checkpointing: true
micro_batch_size: 4
gradient_accumulation_steps: 4

num_epochs: 2
optimizer: adamw_torch_fused
learning_rate: 1.0e-5
lr_scheduler: cosine
cosine_constant_lr_ratio: 0
cosine_min_lr_ratio: 0.1
warmup_ratio: 0.1
weight_decay: 0.0

bf16: true
tf32: true
save_only_model: true

logging_steps: 1
evals_per_epoch: 4
saves_per_epoch: 2

special_tokens:
  pad_token: <|finetune_right_pad_id|>

dataloader_num_workers: 4
dataloader_prefetch_factor: 2

wandb_project: llama32-3b-dados-cemig-chatml
wandb_entity: null
wandb_name: llama3.2-3b-tokenlab-more-cemig-data-chatml
wandb_log_model: checkpoint
