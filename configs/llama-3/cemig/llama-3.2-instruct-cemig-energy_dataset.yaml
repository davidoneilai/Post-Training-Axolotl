base_model: meta-llama/Llama-3.2-3B-Instruct
tokenizer_type: AutoTokenizer
trust_remote_code: true
is_llama_derived_model: true

chat_template: chatml

plugins:
  - axolotl.integrations.liger.LigerPlugin

special_tokens:
  pad_token: "<|eot_id|>"

datasets:
  - path: cemig-ceia/energy_dataset_v1
    type: completion
    field: text


dataset_prepared_path: ./prepared_datasets/energy_dataset_v1
dataset_num_proc: 8

train_on_inputs: true

sequence_len: 8192 
eval_sequence_len: 8192
pad_to_sequence_len: false
sample_packing: true

adapter: lora
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

micro_batch_size: 1               
gradient_accumulation_steps: 256    

learning_rate: 5.0e-5
num_epochs: 2

optimizer: adamw_torch_fused
adam_beta1: 0.9
adam_beta2: 0.999
lr_scheduler: cosine
warmup_ratio: 0.1
weight_decay: 0.0   

save_strategy: steps          
save_steps: 100              
save_total_limit: 10         
save_safetensors: true       
save_only_model: false     

bf16: true          
tf32: true
flash_attention: true

gradient_checkpointing: true

output_dir: ./outputs/llama3.2-instruct-energy_dataset-only
seed: 42

use_wandb: true
wandb_project: "llama3.2-instruct-energy_dataset_v1"
wandb_name: "llama3.2-instruct-energy_dataset_v1"
