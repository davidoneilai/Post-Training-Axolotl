base_model: meta-llama/Llama-3.2-3B-Instruct
tokenizer_type: AutoTokenizer
trust_remote_code: true
is_llama_derived_model: true

datasets:
  - path: nvidia/Llama-Nemotron-Post-Training-Dataset
    type:
      system_prompt: ""
      field_instruction: input
      field_input: ""
      field_output: output
      format: |-
        {instruction}
    split: code
  - path: nvidia/Llama-Nemotron-Post-Training-Dataset
    type:
      system_prompt: ""
      field_instruction: input
      field_input: ""
      field_output: output
      format: |-
        {instruction}
    split: math
  - path: nvidia/Llama-Nemotron-Post-Training-Dataset
    type:
      system_prompt: ""
      field_instruction: input
      field_input: ""
      field_output: output
      format: |-
        {instruction}
    split: science
  - path: nvidia/Llama-Nemotron-Post-Training-Dataset
    type:
      system_prompt: ""
      field_instruction: input
      field_input: ""
      field_output: output
      format: |-
        {instruction}
    split: chat
  - path: nvidia/Llama-Nemotron-Post-Training-Dataset
    type:
      system_prompt: ""
      field_instruction: input
      field_input: ""
      field_output: output
      format: |-
        {instruction}
    split: safety

val_set_size: 0.0   # Desabilitado para evitar OOM na avaliação
dataset_num_proc: 32  # Reduzido para evitar "too many open files"

flash_attention: true

chunked_cross_entropy: true
chunked_cross_entropy_num_chunks: 8

micro_batch_size: 16  # Aumentado para B200 (180GB)
gradient_accumulation_steps: 4  # batch efetivo = 64
evaluation_strategy: "no"  # Desabilitado - rodar benchmark depois
eval_steps: null  # Desabilita avaliação durante o treinamento
num_epochs: 1  # Reduzido para 1 época (já é muito dado)
max_steps: 8000  # Limita número total de steps
sequence_len: 8192             
eval_sequence_len: 2048  # Reduzido drasticamente (avaliação estoura memória)
pad_to_sequence_len: true        
sample_packing: true            

optimizer: adamw_torch_fused       
learning_rate: 2.0e-5
weight_decay: 0.0
betas: [0.9, 0.999]
eps: 1.0e-8

lr_scheduler: cosine
warmup_steps: 100

bf16: true                      
tf32: true
gradient_checkpointing: false

fsdp_version: 2
fsdp_config:
  offload_params: false
  cpu_ram_efficient_loading: true
  state_dict_type: FULL_STATE_DICT
  reshard_after_forward: true
  activation_checkpointing: true

special_tokens:
  eos_token: "<|eot_id|>"
  pad_token: "<|eot_id|>"

eot_tokens:
  - "<|eot_id|>"

roles_to_train:
  - assistant

train_on_eos: last

save_strategy: steps
save_steps: 500  # Salva com menos frequência
save_total_limit: 2  # Mantém apenas 2 checkpoints
save_safetensors: true

logging_steps: 10
output_dir: ./outputs/llama32_instruct_all_data_nemotron
seed: 42
