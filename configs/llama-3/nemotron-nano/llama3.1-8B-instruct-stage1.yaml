base_model: meta-llama/Llama-3.1-8B-Instruct
tokenizer_type: AutoTokenizer
trust_remote_code: true
is_llama_derived_model: true

chat_template: chatml

plugins:
  - axolotl.integrations.liger.LigerPlugin

special_tokens:
  pad_token: "<|eot_id|>"

datasets:
  - path: nvidia/Llama-Nemotron-Post-Training-Dataset
    type:
      system_prompt: "detailed thinking on"
      field_instruction: input
      field_input: ""
      field_output: output
      format: |-
        {instruction}
    split: code
  - path: nvidia/Llama-Nemotron-Post-Training-Dataset
    type:
      system_prompt: "detailed thinking on"
      field_instruction: input
      field_input: ""
      field_output: output
      format: |-
        {instruction}
    split: math
  - path: nvidia/Llama-Nemotron-Post-Training-Dataset
    type:
      system_prompt: "detailed thinking on"
      field_instruction: input
      field_input: ""
      field_output: output
      format: |-
        {instruction}
    split: science

dataset_prepared_path: ./prepared_datasets/nemotron_nano_llama31_8b_stage1
dataset_num_proc: 8


train_on_inputs: false

sequence_len: 32768 
eval_sequence_len: 32768
pad_to_sequence_len: true
sample_packing: true

micro_batch_size: 1               
gradient_accumulation_steps: 256    
num_epochs: 4

learning_rate: 1.0e-4
optimizer: adamw_torch_fused
adam_beta1: 0.9
adam_beta2: 0.999
lr_scheduler: cosine
warmup_ratio: 0.1
weight_decay: 0.0   

bf16: true          
tf32: true
flash_attention: true

gradient_checkpointing: true

output_dir: ./outputs/llama3.1-8b-instruct-stage1
seed: 42

save_strategy: steps          
save_steps: 100              
save_total_limit: 10         
save_safetensors: true       
save_only_model: false      

use_wandb: true
wandb_project: "llama3.1-8b-instruct-stage1"
wandb_name: "llama-stage1-3.1-8b-instruct-nemotron-nano"
