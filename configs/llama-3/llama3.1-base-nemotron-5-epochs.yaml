base_model: meta-llama/Llama-3.1-8B
tokenizer_type: AutoTokenizer
trust_remote_code: true
strict: false

is_llama_derived_model: true

chat_template: chatml

plugins:
  - axolotl.integrations.liger.LigerPlugin

special_tokens:
  pad_token: "<|eot_id|>"

datasets:
  - path: nvidia/Llama-Nemotron-Post-Training-Dataset
    type:
      system_prompt: ""
      field_instruction: input
      field_input: ""
      field_output: output
      format: |-
        {instruction}
    split: code
  - path: nvidia/Llama-Nemotron-Post-Training-Dataset
    type:
      system_prompt: ""
      field_instruction: input
      field_input: ""
      field_output: output
      format: |-
        {instruction}
    split: math
  - path: nvidia/Llama-Nemotron-Post-Training-Dataset
    type:
      system_prompt: ""
      field_instruction: input
      field_input: ""
      field_output: output
      format: |-
        {instruction}
    split: science
  - path: nvidia/Llama-Nemotron-Post-Training-Dataset
    type:
      system_prompt: ""
      field_instruction: input
      field_input: ""
      field_output: output
      format: |-
        {instruction}
    split: chat
  - path: nvidia/Llama-Nemotron-Post-Training-Dataset
    type:
      system_prompt: ""
      field_instruction: input
      field_input: ""
      field_output: output
      format: |-
        {instruction}
    split: safety

dataset_prepared_path: ./prepared_datasets/nemotron_all_splits_llama31_8b

train_on_inputs: false
dataset_num_proc: 8
sequence_len: 8192
eval_sequence_len: 8192
pad_to_sequence_len: true
sample_packing: true
sample_packing_group_size: 100000
sample_packing_bin_size: 200
group_by_length: true
dataloader_pin_memory: false

flash_attn: true

micro_batch_size: 1               
gradient_accumulation_steps: 8    
num_epochs: 5

learning_rate: 2.0e-5
optimizer: adamw_torch_fused
adam_beta1: 0.9
adam_beta2: 0.999
adam_epsilon: 1.0e-8

lr_scheduler: cosine
warmup_steps: 100
weight_decay: 0.0   

bf16: true          
tf32: true
gradient_checkpointing: true
activation_offloading: false

val_set_size: 0.01          
eval_strategy: steps
eval_steps: 100

save_strategy: steps
save_steps: 100
save_total_limit: 3
save_only_model: false
save_safetensors: true
load_best_model_at_end: true
metric_for_best_model: eval_loss
greater_is_better: false

logging_steps: 10

output_dir: ./outputs/Llama-3.1-8B-nemotron-5epochs/
seed: 42

use_wandb: true
wandb_project: "llama31_base_nemotron"
wandb_name: "llama31-8b-base-nemotron"
