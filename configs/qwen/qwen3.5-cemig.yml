base_model: Qwen/Qwen3.5-4B
# Full fine-tune (FFT) of the text-only path of Qwen3.5-4B.

plugins:
  - axolotl.integrations.cut_cross_entropy.CutCrossEntropyPlugin
strict: false

chat_template: qwen3_5
datasets:
  - path: TokenLab/CemigConvoV1.1
    split: regulacao
    type: chat_template
    field_messages: messages
    roles_to_train: [assistant]

  - path: /workspace/pipeline/data/tokenlab-IF-PT/train_chunked_4096tok.jsonl
    ds_type: json
    type: chat_template
    field_messages: messages
    roles_to_train: [assistant]

  - path: /workspace/pipeline/data/tokenlab-IF-PT/train_chunked_4096tok.jsonl
    ds_type: json
    type: chat_template
    field_messages: messages
    roles_to_train: [assistant]

  - path: /workspace/pipeline/data/tokenlab-IF-PT/train_chunked_4096tok.jsonl
    ds_type: json
    type: chat_template
    field_messages: messages
    roles_to_train: [assistant]
    
  - path: /workspace/pipeline/data/distribuicao/norm_tecnicas_dist.jsonl
    ds_type: json
    type: chat_template
    field_messages: messages
    roles_to_train: [assistant]

  - path: TokenLab/mcsynth
    type: chat_template
    split: apenas_letra[:5%]
    field_messages: messages
    roles_to_train: [user, assistant]

val_set_size: 0.0
output_dir: ./outputs/qwen3.5-4b-regulacao-distribuicao-mcsynth-1e5
dataset_prepared_path: ./prepared_datasets/qwen3.5-4b

sequence_len: 4096
sample_packing: true

# Freeze vision encoder
unfrozen_parameters:
  - model.language_model.*
  - lm_head.*

wandb_project: qwen3.5-4b-regulacao-distribuicao
wandb_entity:
wandb_watch:
wandb_name: qwen3.5-4b-regulacao-distribuicao
wandb_log_model:

gradient_accumulation_steps: 4
micro_batch_size: 8
num_epochs: 2
optimizer: adamw_torch_fused
lr_scheduler: cosine
learning_rate: 1e-5

bf16: auto
tf32: true

gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
resume_from_checkpoint:
logging_steps: 1
attn_implementation: flash_attention_2

warmup_ratio: 0.1
evals_per_epoch: 4
saves_per_epoch: 1
weight_decay: 0.0
special_tokens:

